# The same pipelines as .github/workflows/{ci,test,release}.yml, for a fork hosted on GitLab (GitHub
# ignores this file, GitLab ignores .github/). Every merge request and every push to dev runs only the
# test jobs its changes touch (rules:changes below — the same mapping as ci.yml's `changes` job); the
# v* tag that /git-release pushes runs all of them, then the production images and the GitLab Release.
# Make the MR pipeline required: Settings → Merge requests → "Pipelines must succeed". Skipped jobs do
# not fail a pipeline, so a docs-only MR is not blocked.
#
# Images are built here, from the tag, not from a push to main: /git-release merges into main
# *before* it tags, so a main build runs while the tag doesn't exist yet and MinVer / `git describe`
# report X.Y.(Z+1)-preview instead of X.Y.Z. Protect v* tags (Settings → Repository → Protected
# tags) — whoever can push one publishes images.
#
# Runner: the Infrastructure/API tests (Testcontainers) and the image builds need a Docker daemon,
# provided here by a docker:dind service — the runner must allow privileged containers (GitLab.com
# shared runners do). A self-hosted runner with the host's /var/run/docker.sock mounted works too:
# drop `services` and the DOCKER_* variables below.

stages:
  - test
  - images
  - release

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"

variables:
  GIT_DEPTH: "0" # full history + tags: MinVer and `git describe` version the build from them
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

.docker:
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]

# The jobs that install bun (frontend and user guide). Same image as the backend job.
.bun:
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends unzip # the bun installer unzips
    - curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14"
    - export PATH="$HOME/.bun/bin:$PATH"

test:backend:
  extends: .docker
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - changes:
        - backend/**/*
        - shared/openapi/**/*
        - .gitlab-ci.yml
  variables:
    STARTERKIT_TEST_COVERAGE: "1" # reported, not gated — .claude/rules/testing.md § Coverage
  script:
    - dotnet restore backend/StarterKit.sln
    - cp backend/src/StarterKit.API/appsettings.Example.json backend/src/StarterKit.API/appsettings.json
    - backend/scripts/test.sh
    # A controller/DTO change without a re-export leaves the frontend's generated client stale.
    - dotnet build backend/src/StarterKit.API/StarterKit.API.csproj --no-restore -m:1 -p:OpenApiGenerateDocumentsOnBuild=true
    - git diff --exit-code -- shared/openapi/openapi.json || { echo "openapi.json is out of date — run the export and commit it"; exit 1; }
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/TestResults/coverage/**/coverage.cobertura.xml

test:frontend:
  extends: .bun
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - changes:
        - frontend/**/*
        - shared/openapi/**/*
        - .gitlab-ci.yml
  script:
    - bun install --cwd frontend --frozen-lockfile
    - bun run --cwd frontend prettier --check --experimental-cli src/ e2e/
    - bun run --cwd frontend build-only # writes src/typings/, which vue-tsc needs
    - bun run --cwd frontend type-check # vitest doesn't type-check
    - bun run --cwd frontend test:coverage

# The user guide is fed by the app's tokens and logos (frontend/src, frontend/public), so a frontend
# change runs it too.
test:guide:
  extends: .bun
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml
  script:
    - bun install --cwd frontend/user-guide/site --frozen-lockfile
    - bun run --cwd frontend/user-guide/site format:check
    - bun run --cwd frontend/user-guide/site test # includes the content integrity check
    - bun run --cwd frontend/user-guide/site build # fails on dead links

# .claude/rules/comments.md. Scans the whole tree, so it runs on every pipeline — which also keeps a
# docs-only MR's pipeline non-empty.
test:comments:
  extends: .bun
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - bun test scripts/
    - bun scripts/check-comments.ts

# $CI_REGISTRY_IMAGE/<service>:X.Y.Z, plus :latest for a stable (non-pre-release) tag.
images:
  extends: .docker
  stage: images
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  image: docker:27
  parallel:
    matrix:
      - SERVICE: [backend, frontend]
  before_script:
    - apk add --no-cache git
    # The clone's remote URL carries the job token and both Dockerfiles COPY .git/ — drop it first.
    - git remote set-url origin "$CI_PROJECT_URL.git"
    - test "$(git describe --tags --exact-match)" = "$CI_COMMIT_TAG"
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - IMAGE="$CI_REGISTRY_IMAGE/$SERVICE"
    - docker build -f "$SERVICE/Dockerfile" -t "$IMAGE:$VERSION" .
    - docker push "$IMAGE:$VERSION"
    - |
      if echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
        docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
        docker push "$IMAGE:latest"
      fi

release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  image: registry.gitlab.com/gitlab-org/cli:latest
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: See CHANGELOG.md for $CI_COMMIT_TAG.
