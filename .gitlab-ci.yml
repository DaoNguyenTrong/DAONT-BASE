# The same pipeline as .github/workflows/release.yml, for a fork hosted on GitLab (GitHub ignores
# this file, GitLab ignores .github/). Fired by the v* tag that /git-release pushes:
# test → production images → GitLab Release.
#
# Images are built here, from the tag, not from a push to main: /git-release merges into main
# *before* it tags, so a main build runs while the tag doesn't exist yet and MinVer / `git describe`
# report X.Y.(Z+1)-preview instead of X.Y.Z. Protect v* tags (Settings → Repository → Protected
# tags) — whoever can push one publishes images.
#
# Runner: the Infrastructure/API tests (Testcontainers) and the image builds need a Docker daemon,
# provided here by a docker:dind service — the runner must allow privileged containers (GitLab.com
# shared runners do). A self-hosted runner with the host's /var/run/docker.sock mounted works too:
# drop `services` and the DOCKER_* variables below.

stages:
  - test
  - images
  - release

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

variables:
  GIT_DEPTH: "0" # full history + tags: MinVer and `git describe` version the build from them
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

.docker:
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]

test:
  extends: .docker
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - dotnet restore backend/StarterKit.sln
    - cp backend/src/StarterKit.API/appsettings.Example.json backend/src/StarterKit.API/appsettings.json
    - backend/scripts/test.sh
    - apt-get update && apt-get install -y --no-install-recommends unzip # the bun installer unzips
    - curl -fsSL https://bun.sh/install | bash
    - export PATH="$HOME/.bun/bin:$PATH"
    - bun install --cwd frontend --frozen-lockfile
    - bun run --cwd frontend test:run

# $CI_REGISTRY_IMAGE/<service>:X.Y.Z, plus :latest for a stable (non-pre-release) tag.
images:
  extends: .docker
  stage: images
  image: docker:27
  parallel:
    matrix:
      - SERVICE: [backend, frontend]
  before_script:
    - apk add --no-cache git
    # The clone's remote URL carries the job token and both Dockerfiles COPY .git/ — drop it first.
    - git remote set-url origin "$CI_PROJECT_URL.git"
    - test "$(git describe --tags --exact-match)" = "$CI_COMMIT_TAG"
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - IMAGE="$CI_REGISTRY_IMAGE/$SERVICE"
    - docker build -f "$SERVICE/Dockerfile" -t "$IMAGE:$VERSION" .
    - docker push "$IMAGE:$VERSION"
    - |
      if echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
        docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
        docker push "$IMAGE:latest"
      fi

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: See CHANGELOG.md for $CI_COMMIT_TAG.
