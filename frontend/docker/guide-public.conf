# User guide, public mode (GUIDE_PUBLIC=true): anyone can read /guide/. 41-guide-mode.sh copies this
# over /etc/nginx/snippets/guide.conf at container start; see guide-private.conf for the default.

location = /guide {
    return 301 /guide/;
}

location = /guide/_mode {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 'public';
}

location ^~ /guide/ {
    error_page 404 /guide/404.html;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri.html $uri/ =404;

    location ^~ /guide/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
