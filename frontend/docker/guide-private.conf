# User guide, private mode (the image default): only a signed-in user can read /guide/. Included into
# nginx.conf's server block as /etc/nginx/snippets/guide.conf; 41-guide-mode.sh swaps in
# guide-public.conf when GUIDE_PUBLIC=true. $guide_next is the `map` at the top of nginx.conf (a map
# can't live inside a server block).

location = /guide {
    return 301 /guide/;
}

# Read by the guide's client-side guard (.vitepress/theme/auth-guard.ts) to know whether to re-check
# the session on each page change.
location = /guide/_mode {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 'private';
}

location ^~ /guide/ {
    auth_request /_guide_auth;
    # No session (or an expired one): through the app's sign-in and back to this page.
    error_page 401 = @guide_login;
    # auth_request turns anything but 2xx/401/403 from the API into a 500: an API that doesn't answer
    # closes the guide (a static error page) instead of opening it.
    error_page 500 502 503 504 /_guide_unavailable.html;
    error_page 404 /guide/404.html;

    # Readers' pages: never in a shared cache, revalidated on every load.
    add_header Cache-Control "private, no-cache" always;
    try_files $uri $uri.html $uri/ =404;

    # Nested, so it keeps auth_request and the error pages. Hashed file names: cache for a year, but
    # only in the reader's browser. No `always`: a 404 must not be cached.
    location ^~ /guide/assets/ {
        add_header Cache-Control "private, max-age=31536000, immutable";
        try_files $uri =404;
    }
}

location = /_guide_auth {
    internal;
    proxy_pass http://api:8080/api/auth/check;
    proxy_pass_request_body off;
    # A hung API shows the error page in seconds instead of holding every guide request (assets
    # included) for nginx's default 60s.
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    # Only a person's session opens the guide; the endpoint rejects API keys too.
    proxy_set_header X-Api-Key "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Outside /guide/, so showing it doesn't go through auth_request again.
location = /_guide_unavailable.html {
    internal;
    add_header Cache-Control "no-store" always;
}

location @guide_login {
    return 302 /#/guide-auth?next=$guide_next;
}
