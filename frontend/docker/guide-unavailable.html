<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Hướng dẫn sử dụng tạm thời không mở được · User guide unavailable</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7fb;
        --card: #ffffff;
        --text: #1d1b29;
        --muted: #5b5870;
        --border: #e4e2ee;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121019;
          --card: #1c1a26;
          --text: #f2f1f7;
          --muted: #a9a6ba;
          --border: #2d2a3b;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.6 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        max-width: 32rem;
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--card);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
      }
      section + section {
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <!-- Served by nginx when the API that checks the session doesn't answer (frontend/docker/guide-private.conf). -->
  <body id="guide-unavailable">
    <main>
      <section lang="vi">
        <h1>Hướng dẫn sử dụng tạm thời không mở được</h1>
        <p>Hệ thống chưa kiểm tra được phiên đăng nhập của bạn. Hãy thử lại sau ít phút.</p>
        <a href="/">Về ứng dụng</a>
      </section>
      <section lang="en">
        <h1>The user guide is temporarily unavailable</h1>
        <p>We couldn't check your sign-in right now. Please try again in a few minutes.</p>
        <a href="/">Back to the app</a>
      </section>
    </main>
  </body>
</html>
