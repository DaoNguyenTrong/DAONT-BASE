map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /hangfire and /metrics are intentionally NOT proxied — they stay unreachable from the public
    # edge, matching the network-layer-only restriction already decided for both in
    # backend/src/StarterKit.API/Program.cs. Return 404 explicitly instead of letting the SPA
    # fallback below silently serve index.html for them (verified empirically: without this,
    # both paths returned 200 with the app shell instead of failing closed).
    location ~ ^/(hangfire|metrics) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
