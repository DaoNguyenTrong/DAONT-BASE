map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Where the user guide sends a reader without a session (docker/guide-private.conf): the raw request
# path with its query dropped. Raw $request_uri keeps %0d%0a encoded, so it can't split the Location
# header. A map must sit here, in the http context — not in the server block or the included snippet.
map $request_uri $guide_next {
    default /guide/;
    ~^(?<guide_path>[^?]*) $guide_path;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Relative Location headers — no http://host:80/... redirect when running behind a TLS proxy.
    absolute_redirect off;

    # Compress static files and /api responses alike — the nginx:alpine image ships with gzip off.
    # JSON compresses to roughly a fifth. `gzip_proxied any`: by default nginx skips requests that
    # came through a proxy (a `Via` header), and in production every request arrives through the TLS
    # layer in front. `text/event-stream` is deliberately absent: compressing it buffers the stream.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/problem+json application/javascript text/javascript text/css text/plain image/svg+xml;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The user guide (frontend/user-guide), private or public — docker/41-guide-mode.sh picks the
    # snippet at container start.
    include /etc/nginx/snippets/guide.conf;

    # /hangfire and /metrics are intentionally NOT proxied — they stay unreachable from the public
    # edge, matching the network-layer-only restriction already decided for both in
    # backend/src/StarterKit.API/Program.cs. Return 404 explicitly instead of letting the SPA
    # fallback below silently serve index.html for them (verified empirically: without this,
    # both paths returned 200 with the app shell instead of failing closed).
    location ~ ^/(hangfire|metrics) {
        return 404;
    }

    # Runtime config (written at container start, see docker/40-write-runtime-config.sh). A 404 when
    # it was never written, instead of the SPA fallback's index.html, and never cached: a changed
    # value must take effect on the next page load.
    location = /config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Vite build output carries a content hash in its file names — new content, new name — so it can
    # be cached for a year. No `always`: a 404 (a chunk requested mid-deploy) must not be cached too.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html is not hashed and points at the current build's asset names: the browser must
    # revalidate it on every load, or a deploy keeps serving the old bundle. The SPA fallback below
    # lands here too (try_files' last argument is an internal redirect).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
