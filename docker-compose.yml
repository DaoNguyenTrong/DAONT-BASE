services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: dao
      POSTGRES_PASSWORD: 12345aA@
      POSTGRES_DB: StarterKit_api
    ports:
      - "5433:5432"
    volumes:
      - starterkit-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dao"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Every image is pinned: a :latest that moves under you changes the dev stack without a commit.
  mailpit:
    image: axllent/mailpit:v1.30.5
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  seaweedfs:
    image: chrislusf/seaweedfs:4.39
    command: server -s3 -filer -dir=/data
    ports:
      - "8333:8333" # S3 gateway
      - "8888:8888" # Filer HTTP
    volumes:
      - starterkit-seaweedfs-data:/data

  # Opt-in (`docker compose --profile minio up -d minio`): AIStor Free needs a license file, MINIO_LICENSE_FILE
  # (default ./minio.license, gitignored). Without one the container exits at start-up.
  minio:
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
    profiles: ["minio"]
    restart: unless-stopped
    command: server /data --console-address ":9001" --license /minio.license
    environment:
      MINIO_ROOT_USER: starterkit
      MINIO_ROOT_PASSWORD: starterkit-secret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    volumes:
      - starterkit-minio-data:/data
      - ${MINIO_LICENSE_FILE:-./minio.license}:/minio.license:ro

  prometheus:
    image: prom/prometheus:v3.13.2
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # host.docker.internal only resolves on Linux when mapped explicitly like this
      # (Docker Desktop on Mac/Windows provides it out of the box).
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:13.1.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  starterkit-postgres-data:
  starterkit-seaweedfs-data:
  starterkit-minio-data:
