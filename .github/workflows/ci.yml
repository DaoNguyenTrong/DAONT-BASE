# Runs the test gate (test.yml) on every PR and on every push to dev — the push covers what reaches dev
# without a PR: /git-release's CHANGELOG commit and the main → dev reconcile merge.
# Make `test / backend`, `test / frontend` and `test / guide` required status checks on main (see CONTRIBUTING.md).
name: CI

on:
  pull_request:
    branches:
      - dev
      - main
      - "release/**"
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml
