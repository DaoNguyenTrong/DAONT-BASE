# Production, single-instance by default (CacheSettings:Provider=Memory, RealtimeSettings:Backplane=None).
# This file does not run a Redis container — Redis is expected to be provided by the deploy environment.
# To scale `api` beyond 1 replica: point ConnectionStrings:Redis at a Redis reachable from this compose
# network (a managed service, or a host Redis via host.docker.internal + an `extra_hosts` entry on `api`),
# then set CacheSettings:Provider=Redis and RealtimeSettings:Backplane=Redis in appsettings.json.
# Use `abortConnect=false` in the connection string so `api` doesn't crash on boot if Redis lags.
#
# Setup:
#   cp backend/src/StarterKit.API/appsettings.Example.json backend/src/StarterKit.API/appsettings.json
#   # then edit appsettings.json: ConnectionStrings (Host=postgres), JwtSettings, CorsSettings,
#   # EmailSettings, ExternalAuthSettings, FcmSettings with real production values
#   cp .env.prod.example .env.prod
#   # then edit .env.prod: POSTGRES_USER/PASSWORD/DB
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - starterkit-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Trusts X-Forwarded-For/Proto only from this compose network (the nginx `web` service) —
      # must match the `default` network subnet declared below.
      ForwardedHeadersSettings__KnownNetworks__0: 172.28.0.0/16
    volumes:
      - ./backend/src/StarterKit.API/appsettings.json:/app/appsettings.json:ro
      - starterkit-api-uploads:/app/uploads
      - starterkit-api-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    # /api/health answers without the database or the X-TimeZone header. The aspnet image has no curl/wget,
    # so bash's /dev/tcp sends the one request. The Host header must pass AllowedHosts if you narrow it.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /api/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s # migrations run on startup
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    # Runtime config — written to /config.json at container start (frontend/docker/
    # 40-write-runtime-config.sh), so changing a value only needs `up -d`, not a rebuild.
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      VITE_MICROSOFT_CLIENT_ID: ${VITE_MICROSOFT_CLIENT_ID:-}
      VITE_MICROSOFT_TENANT_ID: ${VITE_MICROSOFT_TENANT_ID:-}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
      VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
      # User guide at /guide/: private (signed-in users only) unless "true". See .env.prod.example.
      GUIDE_PUBLIC: ${GUIDE_PUBLIC:-false}
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  starterkit-postgres-data:
  starterkit-api-uploads:
  starterkit-api-logs:
