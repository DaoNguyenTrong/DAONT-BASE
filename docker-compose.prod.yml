# Production, single-instance by default (CacheSettings:Provider=Memory, RealtimeSettings:Backplane=None).
# This file does not run a Redis container — Redis is expected to be provided by the deploy environment.
# To scale `api` beyond 1 replica: point ConnectionStrings:Redis at a Redis reachable from this compose
# network (a managed service, or a host Redis via host.docker.internal + an `extra_hosts` entry on `api`),
# then set CacheSettings:Provider=Redis and RealtimeSettings:Backplane=Redis in appsettings.json.
# Use `abortConnect=false` in the connection string so `api` doesn't crash on boot if Redis lags.
#
# Setup:
#   cp backend/src/StarterKit.API/appsettings.Example.json backend/src/StarterKit.API/appsettings.json
#   # then edit appsettings.json: ConnectionStrings (Host=postgres), JwtSettings, CorsSettings,
#   # EmailSettings, ExternalAuthSettings, FcmSettings with real production values
#   cp .env.prod.example .env.prod
#   # then edit .env.prod: POSTGRES_USER/PASSWORD/DB
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - starterkit-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Trusts X-Forwarded-For/Proto only from this compose network (the nginx `web` service) —
      # must match the `default` network subnet declared below.
      ForwardedHeadersSettings__KnownNetworks__0: 172.28.0.0/16
    volumes:
      - ./backend/src/StarterKit.API/appsettings.json:/app/appsettings.json:ro
      - starterkit-api-uploads:/app/uploads
      - starterkit-api-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  starterkit-postgres-data:
  starterkit-api-uploads:
  starterkit-api-logs:
